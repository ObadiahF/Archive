services:
  backend:
    build:
      context: ./backend
    container_name: archive-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      STORAGE_ROOT: /storage
      AUTH_USERNAME: ${AUTH_USERNAME:?set AUTH_USERNAME in .env}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?set AUTH_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-104857600}
      MAX_FILES_PER_REQUEST: ${MAX_FILES_PER_REQUEST:-20}
    volumes:
      - ${STORAGE_HOST_PATH:-./data}:/storage
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: archive-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
